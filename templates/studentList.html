
<!DOCTYPE html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FastAPI Template</title>
  </head>
<body>
    <h1>List Students from table</h1>

    <!-- Add Student -->
    <a href="/student/add">新增學生</a>

    <table border="1">
    <tr>
        <td>流水號</td>
        <td>學號</td>
        <td>姓名</td>
        <td>身高</td>
        <td>刪除</td>
    </tr>

    {% for p in students %}
    <tr>
        <td>{{ loop.index }}:<a href="/student/edit/{{ p.stuid }}">Edit</a></td>
        <td>{{ p.stuid }}</td>
        <td>{{ p.name }}</td>
        <td>{{ p.height }}</td>
        <td>
            <form method="post" action="/student/delete/{{ p.stuid }}"
                  onsubmit="return confirm('確定要刪除嗎？');">
                <input type="submit" value="刪除">
            </form>
        </td>
    </tr>
    {% endfor %}
    </table>
</body>
</html>
